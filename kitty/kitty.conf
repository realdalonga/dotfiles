#########################################
#            Kitty Config               #
#     Thème : Cherry Crush Love ❤️      #
#########################################

shell /bin/zsh

remember_window_size no
initial_window_width 640
initial_window_height 360
confirm_os_window_close 0

###########
# Font    #
###########

font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
font_size 14.0
enable_ligatures yes

################
# Transparency #
################

dim_opacity 0.9

################
# Base Colors  #
################
# The foreground color
foreground       #c0b18b

# The background color
background       #151515

# The foreground for selections
selection_foreground #2f2f2f

# The background for selections
selection_background #d75f5f

# The cursor color
cursor           #8fee96

# The width (in pts) of window borders. Will be rounded to the nearest number of pixels based on screen resolution.
window_border_width 0

window_margin_width 8
# windows_padding_width 4

# The color for the border of the active window
active_border_color #ffffff

# The color for the border of inactive windows
inactive_border_color #cccccc

# Tab-bar colors
active_tab_foreground #000
active_tab_background #eee
inactive_tab_foreground #444
inactive_tab_background #999


# The 16 terminal colors. There are 8 basic colors, each color has a dull and
# bright version.

# black
color0   #2f2f2f
color8   #555555

# red
color1   #d75f5f
color9   #d75f5f

# green
color2    #d4d232
color10   #8fee96

# yellow
color3    #af865a
color11   #cd950c

# blue
color4   #22c3a1
color12  #22c3a1

# magenta
color5   #775759
color13  #775759

# cyan
color6   #84edb9
color14  #84edb9

# white
color7   #c0b18b
color15  #d8d8d8

#################
# Selection/UI  #
#################

cursor_shape block
cursor_blink_interval 0.55

####################
# Scrollback/Text  #
####################

scrollback_lines 10000
force_ltr yes

####################
# Borders/Window   #
####################

window_border_width 2
active_border_color   #D7263D
inactive_border_color #4A0D16

####################
# Keybindings      #
####################

map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+n new_window
