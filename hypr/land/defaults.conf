$HERE=~/.config/hypr

##########################################################################################
# hyprland cant override variable values so we are taking advantage of that
# if these variables are set in theme, these values wont be used

$DRUN=rofi -show drun
$SEARCH=rofi -show search -modi search:~/.config/rofi/web.py -i -p "Search: "
$TERM=kitty

##########################################################################################

$NATURALSCROLL=yes
$PSEUDOTILE=yes
$WORKSPACESWIPEFINGERS=4

$XZEROSCALING=yes

$DISABLEHYPRLOGO=yes
$ANIMATEDRESIZE=no
$ANIMATEDDRAG=no

$MOD1=SUPER
$MOD2=SUPER_SHIFT
##########################################################################################
