# ~/.config/hypr/hyprlock.conf

background {
    monitor =
    color = rgb(151515)
}

input-field {
    monitor =
    size = 280, 44
    position = 0, -80
    halign = center
    valign = center

    outline_thickness = 2
    outer_color = rgb(D7263D)
    inner_color = rgb(2f2f2f)
    color = rgb(c0b18b)
    font_color = rgb(c0b18b)
    fade_on_empty = true

    placeholder_text = <span foreground="##555555">password</span>
    dots_color = rgb(22c3a1)
    dots_size = 0.25
    dots_spacing = 0.3

    fail_color = rgb(d75f5f)
    fail_text = <span foreground="##d75f5f">incorrect</span>
    fail_transition = 300
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(c0b18b)
    font_size = 64
    font_family = Adwaita Sans
    position = 0, 120
    halign = center
    valign = center
}
